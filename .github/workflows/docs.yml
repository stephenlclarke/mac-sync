name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docc:
    name: Build DocC
    runs-on: macos-26
    steps:
      - name: Check out Mac Sync
        uses: actions/checkout@v7

      - name: Build documentation
        run: make docs DOCS_OUTPUT="$RUNNER_TEMP/mac-sync-docs"

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: mac-sync-docc
          path: ${{ runner.temp }}/mac-sync-docs
