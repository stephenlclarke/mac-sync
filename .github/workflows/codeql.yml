name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Swift traced extraction is not supported with Xcode 27 / Swift 6.4.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Tracing uses Rosetta, so uname inside the traced build reports x86_64.
      # Keep the actual Swift target native to this arm64 runner.
      CODEQL_ARCH: arm64
    steps:
      - name: Checkout mac-sync
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify supported Swift toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies before tracing
        timeout-minutes: 10
        run: swift package resolve

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build Swift package for CodeQL
        timeout-minutes: 35
        run: make codeql-build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
